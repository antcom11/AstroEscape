<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An astronomy escape room for grades 7-10.">
<title>Kepler Observatory Escape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@500;700&family=VT323&display=swap">
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one-screen game — HUD strip, top-down room that scales to fit, inventory tray; puzzles open in a parchment/brass dialog. Committed single dark theme (night observatory). */
:root{
  --night:#0b1024; --floor:#19203f; --panel:#141a35; --panel-2:#1d2548;
  --brass:#d4ab52; --brass-dim:#8f7336; --parchment:#f1e6c8; --ink:#2a2233;
  --teal:#67d6c8; --text:#ebe8f7; --muted:#a8a4c6; --good:#7fd892; --bad:#ff8a7a;
  --moonlit:#f4efd9; --moondark:#2b3152;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--brass);font-size:18px;margin-right:auto}
.stat{display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.stat b{font-size:17px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#room{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.status{min-height:24px;text-align:center;color:var(--muted);font-size:14px}
.status b{color:var(--brass)}
.tray{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:2px}
.tray-label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);flex:none}
.item{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--brass-dim);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.item:hover,.item:focus-visible{border-color:var(--brass);outline:none}
.item .dot{width:12px;height:12px;border-radius:50%;flex:none}
.empty{color:var(--muted);font-size:14px;font-style:italic}

/* room objects */
.obj{cursor:pointer;transition:filter .2s}
.obj.near{filter:drop-shadow(0 0 6px var(--brass)) drop-shadow(0 0 2px var(--brass))}
.obj:hover{filter:drop-shadow(0 0 4px var(--teal))}
.svgtxt{font-family:var(--display);font-weight:700;letter-spacing:.08em}
.orbit{transform-box:view-box;transform-origin:500px 400px;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.twinkle{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.orbit,.twinkle{animation:none}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,8,20,.78);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.panel{background:var(--panel);border:1px solid var(--brass-dim);border-radius:14px;width:100%;max-width:640px;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.panel-in{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--teal)}
h1,h2{font-family:var(--display);color:var(--brass);margin:0;text-wrap:balance;letter-spacing:.03em}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1}
h2{font-size:24px}
p{margin:0;max-width:65ch}
.close{position:absolute;top:10px;right:10px;background:none;border:1px solid transparent;color:var(--muted);font-size:26px;line-height:1;width:40px;height:40px;border-radius:8px;cursor:pointer}
.close:hover,.close:focus-visible{color:var(--text);border-color:var(--brass-dim);outline:none}
.btn{font:inherit;font-weight:700;background:var(--brass);color:#1b1526;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.opt:focus-visible,.dial:focus-visible,.key:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--brass-dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;background:var(--panel-2);color:var(--text);border:1px solid #39416e;border-radius:10px;padding:12px 14px;cursor:pointer;line-height:1.35}
.opt{display:flex;gap:12px;align-items:center}
.opt .letter{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#2b3360;color:var(--brass);border:1px solid var(--brass-dim)}
.opt.right .letter{background:var(--good);color:#10301a;border-color:var(--good)}
.opt:focus-visible{border-color:var(--teal);background:#25305e}
.keyhelp{font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.right{border-color:var(--good);background:rgba(127,216,146,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,138,122,.1);color:var(--muted);text-decoration:line-through}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:12px 14px;font-size:15px}
.feedback.good{background:rgba(127,216,146,.12);border:1px solid rgba(127,216,146,.5)}
.feedback.bad{background:rgba(255,138,122,.1);border:1px solid rgba(255,138,122,.45)}
.feedback.info{background:rgba(103,214,200,.08);border:1px solid rgba(103,214,200,.4)}
.pips{display:flex;gap:6px}
.pip{width:26px;height:6px;border-radius:3px;background:#323a66}
.pip.on{background:var(--brass)}
.qtext{font-size:19px;font-weight:700;line-height:1.35}
.moonfig{display:flex;justify-content:center;padding:8px;background:#070a18;border-radius:10px}
.paper{background:var(--parchment);color:var(--ink);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.paper h3{font-family:var(--display);margin:0;font-size:18px;color:var(--ink)}
.paper .hand{font-style:italic}
.terminal{background:#06120f;border:1px solid #1f4a43;border-radius:10px;padding:16px;font-family:var(--mono);font-size:22px;color:var(--teal);line-height:1.2;display:flex;flex-direction:column;gap:10px}
.terminal input{font:inherit;background:#0b201b;color:var(--teal);border:1px solid #2a6a5f;border-radius:6px;padding:6px 10px;width:100%;max-width:260px;box-sizing:border-box;text-transform:uppercase}
.terminal .opt{font-family:var(--body);font-size:16px}
.dials{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px;background:#070a18;border:1px solid var(--brass-dim);border-radius:12px;padding:10px;cursor:pointer;color:var(--muted);font:inherit;font-size:12px}
.wheels{display:flex;gap:10px;justify-content:center}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{font:inherit;width:48px;height:34px;border-radius:8px;border:1px solid var(--brass-dim);background:var(--panel-2);color:var(--text);cursor:pointer}
.wheel output{font-family:var(--mono);font-size:44px;width:48px;text-align:center;background:#070a18;border-radius:8px;color:var(--brass);font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.key{font:inherit;font-size:22px;font-weight:700;height:52px;border-radius:10px;border:1px solid #3d4677;background:var(--panel-2);color:var(--text);cursor:pointer}
.key.enter{background:var(--brass);color:#1b1526;border:0}
.screen{font-family:var(--mono);font-size:46px;letter-spacing:.35em;text-align:center;background:#070a18;border-radius:10px;padding:6px 0 6px .35em;color:var(--brass)}
.screen.denied{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.card{border:1px dashed #3d4677;border-radius:10px;padding:8px 10px;font-size:14px;color:var(--muted)}
.card.have{border-style:solid;border-color:var(--brass-dim);color:var(--text)}
.card b{font-family:var(--mono);font-size:26px;color:var(--brass);display:block;line-height:1}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.book{font:inherit;text-align:left;border:0;border-radius:6px;padding:14px 12px;min-height:90px;color:#fff;cursor:pointer;font-weight:700;box-shadow:inset 6px 0 0 rgba(0,0,0,.25)}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:13px}
.phases div{display:flex;flex-direction:column;align-items:center;gap:2px}
.planets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.planets td,.planets th{padding:4px 6px;border-bottom:1px solid rgba(42,34,51,.2);text-align:left}
.title-sky{position:absolute;inset:0;pointer-events:none;opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--panel-2);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px;font-variant-numeric:tabular-nums;color:var(--brass)}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
label.fld input{font:inherit;font-size:17px;background:var(--panel-2);color:var(--text);border:1px solid #3d4677;border-radius:8px;padding:10px 12px}
.controls{font-size:14px;color:var(--muted);display:grid;gap:4px}
kbd{font-family:var(--body);font-size:12px;border:1px solid #4a5285;border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--text)}
.toast{position:fixed;left:50%;bottom:max(80px, calc(env(safe-area-inset-bottom, 0px) + 80px));transform:translateX(-50%);background:var(--brass);color:#1b1526;font-weight:700;padding:10px 16px;border-radius:10px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* hands-on puzzles */
.pz-label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
#pz{display:flex;flex-direction:column;gap:10px}
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px}
.slots.list,.pool.list{flex-direction:column}
.slot,.piece{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid #39416e;border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px}
.list .slot,.list .piece{flex-direction:row;text-align:left;gap:12px;min-width:0;padding:10px 12px}
.slot.emptyslot{border-style:dashed;cursor:default;background:transparent}
.slot.locked{border-color:var(--good);background:rgba(127,216,146,.12);cursor:default}
.slot:disabled{color:var(--text)}
.slot-n{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex:none}
.list .slot-n{width:64px}
.slot-empty{color:var(--muted);font-size:13px;padding:12px 4px}
.piece:hover,.slot:not(:disabled):hover{border-color:var(--brass)}
.piece:focus-visible,.slot:focus-visible,.mitem:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.clip{display:flex;flex-direction:column;gap:2px;font-family:Georgia,"Times New Roman",serif}
.clip b{letter-spacing:.02em}
.clip span{font-size:14px;color:var(--muted);font-style:italic}
.starglow{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,var(--c) 42%,transparent 72%)}
.match{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr);gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mitem{font:inherit;text-align:left;display:flex;gap:10px;align-items:center;background:var(--panel-2);color:var(--text);border:1px solid #39416e;border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.3}
.mitem:hover:not(:disabled){border-color:var(--brass)}
.mitem.sel{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.mitem.paired{border-color:var(--brass-dim)}
.mitem.locked{border-color:var(--good);background:rgba(127,216,146,.12);cursor:default;color:var(--text)}
.mitem .tag{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#2b3360;color:var(--brass);font-weight:700;font-size:13px}
.mitem.paired .tag{background:var(--brass);color:#1b1526}
.mitem.locked .tag{background:var(--good);color:#10301a}
.drawwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.field{position:relative;flex:1 1 260px;max-width:400px;aspect-ratio:1/1;background:radial-gradient(circle at 40% 35%,#14205a,#060a1e 75%);border-radius:12px;border:1px solid var(--brass-dim)}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.field{touch-action:none}
.field line.hit{stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke}
.field line.hit:hover{stroke:rgba(255,138,122,.25)}
.field line.pv{stroke:var(--teal);stroke-dasharray:4 4;pointer-events:none}
.field line{stroke:#9fb3ff;stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.field line.bad{stroke:var(--bad);stroke-dasharray:6 4}
.star{position:absolute;width:40px;height:40px;z-index:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.star::after{content:"";width:6px;height:6px;border-radius:50%;background:#c9d1ff;box-shadow:0 0 4px #c9d1ff}
.star.bright::after{width:10px;height:10px;background:#fff;box-shadow:0 0 9px #fff}
.star.sel{box-shadow:0 0 0 2px var(--teal);background:rgba(103,214,200,.15)}
.star:focus-visible{outline:2px solid var(--teal)}
.guide{flex:0 1 150px;align-items:center;text-align:center;padding:12px;font-size:14px}
@media (max-width:520px){.match{grid-template-columns:1fr}}
@media (max-width:520px){.panel-in{padding:18px 16px 20px}.qtext{font-size:17px}.stats{grid-template-columns:1fr 1fr 1fr}.brand{font-size:15px}}
</style>
</head>
<body>

<div class="app">
  <div class="hud">
    <div class="brand">Kepler Observatory</div>
    <div class="stat"><span>Time</span><b id="hTime">0:00</b></div>
    <div class="stat"><span>Stations</span><b id="hDone">0/6</b></div>
    <div class="stat"><span>Mistakes</span><b id="hWrong">0</b></div>
    <button class="btn ghost" id="helpBtn" style="padding:6px 12px;font-size:14px">Mission</button>
  </div>
  <div class="stage">
    <svg id="room" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet" aria-label="Top-down view of the observatory room">
      <defs>
        <pattern id="tiles" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#19203f"/><path d="M60 0H0V60" fill="none" stroke="#222a52" stroke-width="2"/></pattern>
        <linearGradient id="wallg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241c38"/><stop offset="1" stop-color="#3a2e52"/></linearGradient>
        <radialGradient id="sunG"><stop offset="0" stop-color="#fff6c4"/><stop offset="1" stop-color="#f0a52e"/></radialGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#59617f"/><stop offset=".5" stop-color="#8d95b3"/><stop offset="1" stop-color="#59617f"/></linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4630"/><stop offset="1" stop-color="#4c3122"/></linearGradient>
      </defs>
      <rect width="1000" height="720" fill="#0b1024"/>
      <rect x="30" y="120" width="940" height="580" fill="url(#tiles)"/>
      <!-- compass rose inlay -->
      <g fill="none" stroke="#d4ab52" opacity=".35">
        <circle cx="500" cy="400" r="150" stroke-width="2"/><circle cx="500" cy="400" r="162"/>
        <path d="M500 238 L512 388 L662 400 L512 412 L500 562 L488 412 L338 400 L488 388Z" stroke-width="2"/>
      </g>
      <text x="500" y="230" text-anchor="middle" class="svgtxt" fill="#d4ab52" opacity=".45" font-size="16">N</text>
      <!-- walls -->
      <rect x="0" y="0" width="1000" height="120" fill="url(#wallg)"/>
      <g stroke="#2c2342" stroke-width="2"><path d="M60 0V112M300 0V112M640 0V112M920 0V112"/></g>
      <rect x="0" y="112" width="1000" height="9" fill="#4d4068"/>
      <rect x="0" y="120" width="30" height="600" fill="#2a2140"/>
      <rect x="970" y="120" width="30" height="600" fill="#2a2140"/>
      <rect x="0" y="700" width="1000" height="20" fill="#2a2140"/>

      <!-- Star chart -->
      <g class="obj" data-obj="starchart">
        <rect x="70" y="18" width="200" height="92" rx="3" fill="#f1e6c8" stroke="#d4ab52" stroke-width="3"/>
        <rect x="80" y="26" width="180" height="76" fill="#1d2550"/>
        <g stroke="#9fb3ff" stroke-width="1.2" opacity=".8"><path d="M120 40 L135 62 L150 64 L162 66 L178 88 M135 62 L128 90 M162 66 L170 42"/><path d="M205 45 L222 50 L236 48 L244 60 L232 72"/></g>
        <g fill="#fff"><circle cx="120" cy="40" r="2.6"/><circle cx="170" cy="42" r="2.2"/><circle cx="135" cy="62" r="2"/><circle cx="150" cy="64" r="2"/><circle cx="162" cy="66" r="2"/><circle cx="128" cy="90" r="2.4"/><circle cx="178" cy="88" r="2.6"/><circle cx="205" cy="45" r="2"/><circle cx="222" cy="50" r="2"/><circle cx="236" cy="48" r="2"/><circle cx="244" cy="60" r="2"/><circle cx="232" cy="72" r="2"/></g>
      </g>
      <!-- Moon log calendar -->
      <g class="obj" data-obj="calendar">
        <rect x="300" y="22" width="100" height="84" rx="3" fill="#f1e6c8"/>
        <rect x="300" y="22" width="100" height="18" fill="#8b3a3a"/>
        <text x="350" y="35" text-anchor="middle" class="svgtxt" font-size="10" fill="#f1e6c8">MOON LOG</text>
        <g stroke="#2a2233" stroke-width="1.2"><circle cx="322" cy="60" r="9" fill="#2a2233"/><circle cx="350" cy="60" r="9" fill="none"/><circle cx="378" cy="60" r="9" fill="none"/><circle cx="336" cy="86" r="9" fill="none"/></g>
        <g font-size="11" fill="#2a2233" text-anchor="middle" font-weight="700"><text x="350" y="64">?</text><text x="378" y="64">?</text><text x="336" y="90">?</text></g>
      </g>
      <!-- Airlock door -->
      <g class="obj" data-obj="door">
        <rect x="450" y="8" width="120" height="112" rx="6" fill="#3d4466" stroke="#8d95b3" stroke-width="3"/>
        <rect id="doorL" x="458" y="16" width="52" height="104" fill="url(#metal)"/>
        <rect id="doorR" x="510" y="16" width="52" height="104" fill="url(#metal)"/>
        <circle cx="510" cy="50" r="17" fill="#0e1430" stroke="#c7cde3" stroke-width="3"/>
        <path d="M510 16V120" stroke="#2b3152" stroke-width="2"/>
        <circle id="doorLight" cx="510" cy="13" r="4" fill="#ff5a4a"/>
        <rect x="582" y="42" width="34" height="46" rx="4" fill="#1d2235" stroke="#8d95b3"/>
        <g fill="#d4ab52"><circle cx="592" cy="55" r="2.5"/><circle cx="599" cy="55" r="2.5"/><circle cx="606" cy="55" r="2.5"/><circle cx="592" cy="64" r="2.5"/><circle cx="599" cy="64" r="2.5"/><circle cx="606" cy="64" r="2.5"/><circle cx="592" cy="73" r="2.5"/><circle cx="599" cy="73" r="2.5"/><circle cx="606" cy="73" r="2.5"/></g>
      </g>
      <!-- Space race poster -->
      <g class="obj" data-obj="poster">

function fmtTime(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0")}
function moonSVG(i,size=72){
  const r=26,p=i/8;let lit="";
  if(i===4) lit=`<circle r="${r}" fill="var(--moonlit)"/>`;
  else if(i!==0){
    const rx=(Math.abs(Math.cos(2*Math.PI*p))*r).toFixed(2);let d;
    if(p<.5){const sw=p<.25?0:1;d=`M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${sw} 0,${-r}Z`}
    else{const sw=p<.75?0:1;d=`M0,${-r} A${r},${r} 0 0 0 0,${r} A${rx},${r} 0 0 ${sw} 0,${-r}Z`}
    lit=`<path d="${d}" fill="var(--moonlit)"/>`;
  }
  return `<svg viewBox="-30 -30 60 60" width="${size}" height="${size}" aria-hidden="true"><circle r="${r}" fill="var(--moondark)" stroke="#4a5285" stroke-width="1"/>${lit}</svg>`;
}

let curOpts=null;
function header(k){const st=STATIONS[k];return `<div class="eyebrow">${st.topic}</div><h2>${st.name}</h2>`}
function openStation(k){
  const st=STATIONS[k];
  if(st.lock&&!S.unlocked[k]) return openLock(k);
  if(S.done[k]) return openModal(header(k)+`<div class="feedback good">Station complete. You collected the <b>${ITEMS[st.reward].name}</b>.</div>`+rewardBody(st.reward)+`<div class="row"><button class="btn" data-act="close">Back to the room</button></div>`);
  if(S.prog[k]===0) return openModal(header(k)+`<p>${INTRO[k]}</p><p style="color:var(--muted)">Answer 2 questions, then solve a hands-on puzzle to unlock the reward.</p><div class="row"><button class="btn" data-act="quiz" data-k="${k}">Begin</button></div>`);
  renderQ(k);
}
function pipsHTML(n){return [0,1,2].map(i=>`<span class="pip ${i<n?"on":""}"></span>`).join("")}
function renderQ(k){
  if(S.prog[k]>=2) return renderPuzzle(k);
  const st=STATIONS[k],n=S.prog[k],q=QB[st.bank][S.picks[k][n]];
  curOpts=shuffle([q.a,...q.w]);
  const pips=pipsHTML(n);
  const term=k==="computer";
  const body=`<div class="row" style="justify-content:space-between"><span class="pips">${pips}</span><span style="color:var(--muted);font-size:14px">Step ${n+1} of 3</span></div>
   ${q.moon!==undefined?`<div class="moonfig">${moonSVG(q.moon,120)}</div>`:""}
   <div class="qtext">${esc(q.q)}</div>
   <div class="opts">${curOpts.map((o,i)=>`<button class="opt" data-act="ans" data-k="${k}" data-i="${i}"><span class="letter">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
   <div class="keyhelp">Press <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> to answer, or use <kbd>↑</kbd> <kbd>↓</kbd> and <kbd>Enter</kbd>.</div>
   <div id="fb"></div>
   <div class="row" id="qActions"><button class="btn ghost" data-act="hint" data-k="${k}">Show hint</button></div>`;
  openModal(header(k)+(term?`<div class="terminal" style="font-size:20px">KNOWLEDGE CHECK ${n+1}/2</div>`:"")+body);
}
function answer(k,i,btn){
  const st=STATIONS[k],q=QB[st.bank][S.picks[k][S.prog[k]]];
  const choice=curOpts[i];
  if(choice===q.a){
    btn.classList.add("right");
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    S.prog[k]++;
    const last=false;
    $("#fb").innerHTML=`<div class="feedback good"><b>Correct!</b> ${esc(q.why)}</div>`;
    $("#qActions").innerHTML=`<button class="btn" data-act="next" data-k="${k}">${S.prog[k]>=2?"On to the puzzle":"Next question"}</button>`;
    $("#qActions .btn").focus();
    save();
  } else {
    btn.classList.add("wrong");btn.disabled=true;
    S.wrong++;renderHUD();save();
    const p=$("#panel");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");
    $("#fb").innerHTML=`<div class="feedback bad">Not quite. Try another answer.</div>`;
    const left=[...document.querySelectorAll(".opt:not(:disabled)")];
    if(left.length) left[0].focus();
  }
}
function rewardBody(id){
  const it=ITEMS[id];
  if(it.planet) return `<div class="cards"><div class="card have" style="border-color:${it.color}">${it.name}<b>${S.digits[id]}</b></div></div><p style="color:var(--muted)">One of four planet code cards. The airlock needs all four.</p>`;
  return `<div>${it.desc()}</div>`;
}
function claim(k){
  const st=STATIONS[k];S.done[k]=true;give(st.reward);renderBadges();renderHUD();
  const extra = k==="starchart"?"<p>The tag says DESK. Maybe it opens a drawer.</p>":"";

}

function seqState(k,items,answer,labels,opts={}){
  const slots=answer.map(()=>null),locked=new Set();
  (opts.fixed||[]).forEach(i=>{slots[i]=answer[i];locked.add(i)});
  return {type:"seq",k,items,answer,slots,locked,labels,layout:opts.layout||"tiles",poolOrder:shuffle(Object.keys(items))};
}
function renderPuzzle(k){

    PZ={type:"draw",k,c,edges:new Set(),bad:new Set(),hist:[],sel:null,stars:shuffle([...c.stars.map((p,i)=>({id:"s"+i,x:p[0],y:p[1],b:1})),...c.extra.map((p,i)=>({id:"x"+i,x:p[0],y:p[1],b:0}))])};
  } else if(k==="telescope"){

    times.forEach((t,i)=>items["t"+i]=trailSVG(S.trailBase-45*i));

function bindDraw(){
  const field=$("#pz .field");if(!field) return;
  const pv=field.querySelector("#pv");let from=null;
  const pt=e=>{const r=field.getBoundingClientRect();return [(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
  field.addEventListener("pointerdown",e=>{const s=e.target.closest(".star");if(!s) return;from=s.dataset.id;const st=PZ.stars.find(x=>x.id===from);pv.setAttribute("x1",st.x);pv.setAttribute("y1",st.y);pv.setAttribute("x2",st.x);pv.setAttribute("y2",st.y)});
  field.addEventListener("pointermove",e=>{if(!from) return;const [x,y]=pt(e);pv.setAttribute("x2",x);pv.setAttribute("y2",y);pv.style.display=""});
  const end=e=>{
    if(!from) return;const a=from;from=null;pv.style.display="none";
    if(e.type!=="pointerup") return;
    const el=document.elementFromPoint(e.clientX,e.clientY),s=el&&el.closest?el.closest("#pz .star"):null;
    if(s&&s.dataset.id!==a){toggleEdge(a,s.dataset.id);PZ.sel=null;drawPZ()}
  };
  field.addEventListener("pointerup",end);field.addEventListener("pointercancel",end);
}
function pzFocus(sel){setTimeout(()=>{const f=$(sel)||$("#pz button:not(:disabled)")||$("[data-act=pz-check]");if(f) f.focus({preventScroll:true})},0)}
function pzSolved(){
  const k=PZ.k;S.prog[k]=3;save();
  const msg={
    starchart:PZ.c&&PZ.c.note,
    telescope:"Because Earth rotates, stars near Polaris circle it counterclockwise at 15° per hour. Every 3 hours the Big Dipper turns 45°.",
    orrery:"All six planet files are back where they belong. Saturn really is less dense than water!",
    moonbox:"New → waxing crescent → first quarter → waxing gibbous → full → waning gibbous → third quarter → waning crescent. One cycle takes about 29.5 days.",
    cabinet:"Sputnik 1 (1957) → NASA founded (1958) → Gagarin (1961) → Tereshkova (1963) → Apollo 11 (1969).",
    computer:"Spica (about 22,000 K) → Sirius (about 9,900 K) → the Sun (about 5,800 K) → Arcturus (about 4,300 K) → Betelgeuse (about 3,500 K)."
  }[k];
  document.querySelectorAll("#pz button").forEach(b=>b.disabled=true);
  document.querySelectorAll(".pips .pip").forEach(p=>p.classList.add("on"));
  $("#fb").innerHTML=`<div class="feedback good"><b>Solved!</b> ${msg}</div>`;
  $("#qActions").innerHTML=`<button class="btn" data-act="reward" data-k="${k}">Claim reward</button>`;
  $("#qActions .btn").focus();
}
function pzMistake(msg){
  S.wrong++;renderHUD();save();
  $("#fb").innerHTML=`<div class="feedback bad">${msg}</div>`;
  const p=$("#panel");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");
}
function pzAction(a,b){
  if(!PZ) return;
  const fb=$("#fb");
  if(a==="pz-hint"){S.hints++;save();fb.innerHTML=`<div class="feedback info"><b>Hint:</b> ${PZ_HINT[PZ.k]}</div>`;return}
  if(a==="pz-clear"){PZ.edges.clear();PZ.bad.clear();PZ.hist=[];PZ.sel=null;drawPZ();return}
  if(a==="pz-undo"){while(PZ.hist.length){const e=PZ.hist.pop();if(PZ.edges.has(e)){PZ.edges.delete(e);break}}PZ.bad.clear();PZ.sel=null;drawPZ();return}
  if(a==="pz-line"){PZ.edges.delete(b.dataset.e);PZ.bad.clear();PZ.sel=null;drawPZ();return}
  if(a==="pz-pool"){
    const i=PZ.slots.indexOf(null);if(i<0) return;
    PZ.slots[i]=b.dataset.id;drawPZ();
    pzFocus(PZ.slots.includes(null)?"#pz .pool button":"[data-act=pz-check]");return;
  }
  if(a==="pz-slot"){const i=+b.dataset.i;const id=PZ.slots[i];PZ.slots[i]=null;drawPZ();pzFocus(`#pz [data-act=pz-pool][data-id="${id}"]`);return}
  if(a==="pz-star"){
    const id=b.dataset.id;PZ.bad.clear();
    if(!PZ.sel) PZ.sel=id;
    else if(PZ.sel===id) PZ.sel=null;
    else{toggleEdge(PZ.sel,id);PZ.sel=null}
    drawPZ();pzFocus(`#pz [data-id="${id}"]`);return;
  }
  if(a==="pz-left"){const id=b.dataset.id;if(PZ.locked.has(id)) return;delete PZ.pairs[id];PZ.sel=PZ.sel===id?null:id;drawPZ();pzFocus(`#pz [data-act=pz-right]:not(:disabled)`);return}
  if(a==="pz-right"){
    const id=b.dataset.id,o=Object.keys(PZ.pairs).find(l=>PZ.pairs[l]===id);
    if(!PZ.sel){ if(o){delete PZ.pairs[o];drawPZ();pzFocus(`#pz [data-act=pz-left][data-id="${o}"]`)} else fb.innerHTML=`<div class="feedback info">Click a planet on the left first.</div>`; return }
    if(o) delete PZ.pairs[o];
    PZ.pairs[PZ.sel]=id;PZ.sel=null;drawPZ();
    const next=PZ.left.find(p=>!PZ.pairs[p.id]);pzFocus(next?`#pz [data-act=pz-left][data-id="${next.id}"]`:"[data-act=pz-check]");return;
  }
  if(a==="pz-check"){
    if(PZ.type==="seq"){
      if(PZ.slots.includes(null)){fb.innerHTML=`<div class="feedback info">Fill every spot before checking.</div>`;return}
      let right=0;PZ.slots.forEach((id,i)=>{if(id===PZ.answer[i]){PZ.locked.add(i);right++}else PZ.slots[i]=null});
      drawPZ();
      if(right===PZ.answer.length) return pzSolved();
      const fixed=PZ.k==="telescope"||PZ.k==="moonbox"?1:0;
      pzMistake(`${right-fixed} of ${PZ.answer.length-fixed} pieces were in the right spot. Those are locked in green. The rest went back to the pile.`);
      pzFocus("#pz .pool button");return;
    }
    if(PZ.type==="match"){
      if(PZ.left.some(p=>!PZ.pairs[p.id])){fb.innerHTML=`<div class="feedback info">Match every planet before checking.</div>`;return}
      let right=0;PZ.left.forEach(p=>{if(PZ.pairs[p.id]===p.id){PZ.locked.add(p.id);right++}else delete PZ.pairs[p.id]});
      drawPZ();
      if(right===PZ.left.length) return pzSolved();
      pzMistake(`${right} of ${PZ.left.length} matches were correct. Those are locked in green. Try the rest again.`);
      pzFocus("#pz [data-act=pz-left]:not(:disabled)");return;
    }
    if(PZ.type==="draw"){
      const req=new Set(PZ.c.edges.map(([a,b])=>["s"+a,"s"+b].sort().join("|")));
      if(!PZ.edges.size){fb.innerHTML=`<div class="feedback info">Draw some lines first: click a star, then another star.</div>`;return}
      let hit=0;PZ.bad=new Set();PZ.edges.forEach(e=>req.has(e)?hit++:PZ.bad.add(e));
      if(hit===req.size&&!PZ.bad.size){drawPZ();return pzSolved()}
      PZ.sel=null;drawPZ();
      const n=PZ.bad.size;
      pzMistake(`${hit} of ${req.size} lines are correct.${n?` ${n} line${n>1?"s don't":" doesn't"} belong (shown dashed in red).`:""}${hit<req.size?` ${req.size-hit} line${req.size-hit>1?"s are":" is"} still missing.`:""}`);
      return;
    }
  }
}

let doorCode="";
function pressKey(n){
  const scr=$("#scr");scr.classList.remove("denied");
  if(n==="C"){doorCode=""}
  else if(n==="E"){
    if(doorCode.length<4){$("#fb").innerHTML=`<div class="feedback info">Enter all four digits first.</div>`;return}
    const code=PLANET_ORDER.map(p=>S.digits[p]).join("");
    if(doorCode===code&&PLANET_ORDER.every(p=>S.inv.includes(p))){return escape()}
    S.wrong++;renderHUD();save();scr.textContent="DENIED";scr.classList.add("denied");doorCode="";
    $("#fb").innerHTML=`<div class="feedback bad">Access denied. Check your planet cards and their order.</div>`;return;
  } else if(doorCode.length<4) doorCode+=n;
  scr.textContent=(doorCode+"____").slice(0,4);
}

  S.hints++;save();

  else h="Put the digits in order of the planets' distance from the Sun. The \"Planets in Order\" book on the bookshelf can help.";
  $("#fb").innerHTML=`<div class="feedback info">${h}</div>`;
}

  if(a==="resume"){S=loadSaved();placePlayer();renderAll();$("#modal").hidden=true;modalOpen=false;return}
  if(a==="restart"){clearSave();resetDoor();return showTitle()}
  if(a==="confirmRestart"){return openModal(`<h2>Restart the game?</h2><p>All progress will be lost, and you'll get new questions and new planet codes.</p><div class="row"><button class="btn" data-act="restart">Yes, restart</button><button class="btn ghost" data-act="close">Cancel</button></div>`)}
  if(a==="quiz"||a==="next") return renderQ(k);
  if(a==="ans") return answer(k,+b.dataset.i,b);
  if(a==="reward") return claim(k);
  if(a.startsWith("pz-")) return pzAction(a,b);
  if(a==="hint"){const st=STATIONS[k],q=QB[st.bank][S.picks[k][S.prog[k]]];S.hints++;save();b.disabled=true;b.textContent="Hint used";const h=document.createElement("div");h.className="feedback info";h.innerHTML="<b>Hint:</b> "+esc(q.hint);$("#fb").before(h);return}
  if(a==="lockhint"){S.hints++;save();$("#fb").innerHTML=`<div class="feedback info"><b>Hint:</b> ${LOCK_HINT[k]}</div>`;return}
  if(a==="wheel"){const i=+b.dataset.i;lockVal.v[i]=(lockVal.v[i]+ +b.dataset.d+10)%10;$("#w"+i).textContent=lockVal.v[i];return}
  if(a==="tryyear"){return lockVal.v.join("")==="1957"?unlock("cabinet"):lockFail("The drawer won't budge. Wrong year.")}
  if(a==="trypw") return tryPw();
  if(a==="dial"){const i=+b.dataset.i;lockVal.v[i]=(lockVal.v[i]+1)%8;b.innerHTML=`${moonSVG(lockVal.v[i],64)}<span>Dial ${i+1}</span>`;b.setAttribute("aria-label",`Dial ${i+1}: ${PHASES[lockVal.v[i]]}`);return}
  if(a==="trymoon"){return lockVal.v.join("")==="0246"?unlock("moonbox"):lockFail("Click. The lid stays shut. Check the Moon Log again.")}
  if(a==="book") return openBook(b.dataset.b);
  if(a==="shelf") return openBookshelf();
  if(a==="key") return pressKey(b.dataset.n);
  if(a==="doorhint") return doorHint();
});
$("#inv").addEventListener("click",e=>{
  const b=e.target.closest("[data-item]");if(!b) return;const id=b.dataset.item,it=ITEMS[id];
  openModal(`<div class="eyebrow">Inventory</div><h2>${it.name}</h2>${it.planet?rewardBody(id):`<div>${it.desc()}</div>`}<div class="row"><button class="btn" data-act="close">Close</button></div>`);
});
$("#helpBtn").addEventListener("click",()=>{if(S&&!S.escaped&&!modalOpen) showHelp()});
function resetDoor(){$("#doorL").setAttribute("x","458");$("#doorL").setAttribute("width","52");$("#doorR").setAttribute("x","510");$("#doorR").setAttribute("width","52")}

/* ---------- Movement ---------- */
const keys=new Set();let target=null,pending=null,route=[],stuck=0,facing=0;
const player=$("#player"),playerRot=$("#playerRot"),svg=$("#room");
function placePlayer(){player.setAttribute("transform",`translate(${S.pos.x} ${S.pos.y})`)}
function hitsSolid(x,y){
  if(x<BOUNDS.x0||x>BOUNDS.x1||y<BOUNDS.y0||y>BOUNDS.y1) return true;
  for(const o of SOLIDS){const [rx,ry,rw,rh]=o.rect;const cx=Math.max(rx,Math.min(x,rx+rw)),cy=Math.max(ry,Math.min(y,ry+rh));if((x-cx)**2+(y-cy)**2<R*R) return true}
  return false;
}
function distTo(o,x,y){const [rx,ry,rw,rh]=o.rect;const cx=Math.max(rx,Math.min(x,rx+rw)),cy=Math.max(ry,Math.min(y,ry+rh));return Math.hypot(x-cx,y-cy)}
function nearest(){let best=null,bd=NEAR;for(const o of OBJ){const d=distTo(o,S.pos.x,S.pos.y);if(d<bd){bd=d;best=o}}return best}
function segHits(x1,y1,x2,y2,r){ // Liang-Barsky against rect r=[x,y,w,h]
  let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
  const p=[-dx,dx,-dy,dy],q=[x1-r[0],r[0]+r[2]-x1,y1-r[1],r[1]+r[3]-y1];
  for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0) return false}else{const t=q[i]/p[i];if(p[i]<0){if(t>t1) return false;if(t>t0) t0=t}else{if(t<t0) return false;if(t<t1) t1=t}}}
  return true;
}
function planRoute(tx,ty){
  const pad=R+6,{x,y}=S.pos;
  for(const o of SOLIDS){
    const r=[o.rect[0]-pad,o.rect[1]-pad,o.rect[2]+2*pad,o.rect[3]+2*pad];
    if(!segHits(x,y,tx,ty,[r[0]+2,r[1]+2,r[2]-4,r[3]-4])) continue;
    const c=[[r[0],r[1]],[r[0]+r[2],r[1]],[r[0]+r[2],r[1]+r[3]],[r[0],r[1]+r[3]]].filter(([cx,cy])=>!hitsSolid(cx,cy));
    const inner=[r[0]+3,r[1]+3,r[2]-6,r[3]-6];
    let best=null,bl=1e9;
    for(const a of c){if(!segHits(x,y,a[0],a[1],inner)&&!segHits(a[0],a[1],tx,ty,inner)){const l=Math.hypot(a[0]-x,a[1]-y)+Math.hypot(tx-a[0],ty-a[1]);if(l<bl){bl=l;best=[a]}}}
    if(!best){for(const a of c)for(const b of c){if(a===b) continue;if(!segHits(x,y,a[0],a[1],inner)&&!segHits(a[0],a[1],b[0],b[1],inner)&&!segHits(b[0],b[1],tx,ty,inner)){const l=Math.hypot(a[0]-x,a[1]-y)+Math.hypot(b[0]-a[0],b[1]-a[1])+Math.hypot(tx-b[0],ty-b[1]);if(l<bl){bl=l;best=[a,b]}}}}
    if(best) return [...best,[tx,ty]];
  }
  return [[tx,ty]];
}
function walkTo(tx,ty,obj){
  route=planRoute(tx,ty);target=route.shift();pending=obj||null;stuck=0;
  const m=$("#marker");m.setAttribute("cx",tx);m.setAttribute("cy",ty);m.setAttribute("opacity",".9");
}
function svgPoint(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener("pointerdown",e=>{
  if(modalOpen||!S||S.escaped) return;
  const g=e.target.closest("[data-obj]");
  if(g){const o=OBJ_BY[g.dataset.obj];if(distTo(o,S.pos.x,S.pos.y)<NEAR) return interact(o.id);return walkTo(o.ap[0],o.ap[1],o.id)}
  const p=svgPoint(e);walkTo(p.x,p.y,null);
});
window.addEventListener("keydown",e=>{
  if(modalOpen){
    if(e.key==="Escape"&&$("#panel .close")) return closeModal();
    const opts=[...document.querySelectorAll("#panel .opt")];
    const kk=e.key.toLowerCase();
    const grp=document.activeElement&&document.activeElement.closest?document.activeElement.closest("#panel [data-group]"):null;
    if(grp&&kk.startsWith("arrow")){const bs=[...grp.querySelectorAll("button:not(:disabled)")];const gi=bs.indexOf(document.activeElement);if(gi>=0){e.preventDefault();const d=(kk==="arrowright"||kk==="arrowdown")?1:-1;bs[(gi+d+bs.length)%bs.length].focus()}return}
    if(!opts.length||e.target.matches("input,textarea")) return;
    const k=e.key.toLowerCase(), li="abcd".indexOf(k), ni="1234".indexOf(k), idx=li>=0?li:ni;
    if(idx>=0&&opts[idx]){ e.preventDefault(); if(!opts[idx].disabled) opts[idx].click(); return }
    if(k==="arrowdown"||k==="arrowup"){
      const live=opts.filter(o=>!o.disabled); if(!live.length) return;
      e.preventDefault();
      const cur=live.indexOf(document.activeElement);
      const next=cur<0?(k==="arrowdown"?0:live.length-1):(cur+(k==="arrowdown"?1:-1)+live.length)%live.length;
      live[next].focus();
    }
    return;
  }
  if(!S) return;
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){keys.add(k);target=null;pending=null;route=[];$("#marker").setAttribute("opacity","0");e.preventDefault()}
  if(k==="e"||k===" "||k==="enter"){const n=nearest();if(n){e.preventDefault();interact(n.id)}}
});
window.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
window.addEventListener("blur",()=>keys.clear());

let last=performance.now(),nearId=null,saveT=0;
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S&&!modalOpen&&!S.escaped){
    let dx=0,dy=0;
    if(keys.has("arrowleft")||keys.has("a")) dx-=1;
    if(keys.has("arrowright")||keys.has("d")) dx+=1;
    if(keys.has("arrowup")||keys.has("w")) dy-=1;
    if(keys.has("arrowdown")||keys.has("s")) dy+=1;
    if(!dx&&!dy&&target){
      const tx=target[0]-S.pos.x,ty=target[1]-S.pos.y,d=Math.hypot(tx,ty);
      if(d<4){
        if(route.length){target=route.shift()}
        else{target=null;$("#marker").setAttribute("opacity","0");if(pending){const id=pending;pending=null;if(distTo(OBJ_BY[id],S.pos.x,S.pos.y)<NEAR+20) interact(id)}}
      } else {dx=tx/d;dy=ty/d}
    }
    const len=Math.hypot(dx,dy);
    if(len){
      dx/=len;dy/=len;facing=Math.atan2(dy,dx)*180/Math.PI;
      const step=SPEED*dt,ox=S.pos.x,oy=S.pos.y;
      const nx=S.pos.x+dx*step;if(!hitsSolid(nx,S.pos.y)) S.pos.x=nx;
      const ny=S.pos.y+dy*step;if(!hitsSolid(S.pos.x,ny)) S.pos.y=ny;
      const moved=Math.hypot(S.pos.x-ox,S.pos.y-oy);
      if(target){ if(moved<step*.3){stuck+=dt;if(stuck>.4){target=null;route=[];$("#marker").setAttribute("opacity","0");if(pending&&distTo(OBJ_BY[pending],S.pos.x,S.pos.y)<NEAR+30){const id=pending;pending=null;interact(id)}else pending=null}} else stuck=0 }
      placePlayer();playerRot.setAttribute("transform",`rotate(${facing.toFixed(1)})`);
      saveT+=dt;if(saveT>2){saveT=0;save()}
    }
    const n=nearest();const id=n?n.id:null;
    if(id!==nearId){
      document.querySelectorAll(".obj.near").forEach(g=>g.classList.remove("near"));
      if(id) document.querySelector(`[data-obj="${id}"]`)?.classList.add("near");
      $("#status").innerHTML=id?`<b>${n.name}</b>: press <kbd>E</kbd> or tap it to inspect`:'Walk with <kbd>W A S D</kbd> or arrow keys, or tap the floor. Tap an object to inspect it.';
      nearId=id;
    }
  }
  requestAnimationFrame(tick);
}
setInterval(renderHUD,500);
requestAnimationFrame(tick);
showTitle();
</script>

</body>
</html>
